name: PoseDriver release checks

on:
  push:
  pull_request:

jobs:
  package-and-metric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: |
          python -m pip install 'numpy<2' wheel Cython
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PoseDriver
        run: python -m pip install --no-build-isolation -e '.[train]' pytest
      - name: Check source and commands
        run: |
          python -m compileall -q src/openpifpaf experiments
          for script in experiments/commands/*.sh; do bash -n "$script"; done
          python -m openpifpaf.predict --help >/dev/null
          python experiments/predict_five_branch.py --help >/dev/null
      - name: Verify bicycle scoring and full-split lane loading
        run: python -m pytest -o addopts='' -q tests/test_posedriver_bicycle_metric.py tests/test_posedriver_lane_dataset.py
